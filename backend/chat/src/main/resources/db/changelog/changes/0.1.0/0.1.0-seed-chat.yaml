# Demo seed data — runs ONLY under the `seed` Liquibase context (dev stack sets it).
databaseChangeLog:
  - changeSet:
      id: 0.1.0-seed-chat
      author: codillas
      context: seed
      comment: Demo chat room with members and messages (dev only)
      changes:
        - sqlFile:
            path: 0.1.0-seed-chat.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
