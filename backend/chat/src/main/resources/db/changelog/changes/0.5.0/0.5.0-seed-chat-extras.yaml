# Demo seed extras — runs ONLY under the `seed` Liquibase context (dev stack sets it).
databaseChangeLog:
  - changeSet:
      id: 0.5.0-seed-chat-extras
      author: codillas
      context: seed
      comment: Demo DIRECT room Tom<->Sam for the DM notification deep-link (dev only)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck:
                expectedResult: 1
                sql: SELECT count(*) FROM chat_rooms WHERE name = 'DM Tom-Sam' AND type = 'DIRECT'
      changes:
        - sqlFile:
            path: 0.5.0-seed-chat-extras.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
