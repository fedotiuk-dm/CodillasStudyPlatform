databaseChangeLog:
  - changeSet:
      id: 0.5.0-add-assignment-grading
      author: codillas
      comment: Late-penalty config + rubric link on assignments (0.5.0)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: assignments
                columnName: late_penalty_pct_per_day
      changes:
        - addColumn:
            tableName: assignments
            columns:
              - column:
                  name: late_penalty_pct_per_day
                  type: int
              - column:
                  name: max_late_penalty_pct
                  type: int
              - column:
                  name: rubric_id
                  type: uuid
