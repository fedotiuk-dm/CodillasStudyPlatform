databaseChangeLog:
  - changeSet:
      id: 0.1.0-create-assignments
      author: codillas
      comment: Create assignments table (initial development 0.1.0)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: assignments
      changes:
        - createTable:
            tableName: assignments
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: group_id
                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: lesson_id
                  type: uuid
              - column:
                  name: title
                  type: varchar(200)
                  constraints: { nullable: false }
              - column:
                  name: description
                  type: text
              - column:
                  name: due_at
                  type: timestamptz
              - column:
                  name: status
                  type: varchar(20)
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: timestamptz
              - column:
                  name: updated_at
                  type: timestamptz
