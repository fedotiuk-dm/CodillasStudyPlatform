# Demo seed extras — runs ONLY under the `seed` Liquibase context (dev stack sets it).
databaseChangeLog:
  - changeSet:
      id: 0.5.0-seed-homework-extras
      author: codillas
      context: seed
      comment: Demo rubric-graded + late-penalty assignments (dev only)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck:
                expectedResult: 1
                sql: SELECT count(*) FROM assignments WHERE title = 'Week 2 — Rubric Essay'
      changes:
        - sqlFile:
            path: 0.5.0-seed-homework-extras.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
