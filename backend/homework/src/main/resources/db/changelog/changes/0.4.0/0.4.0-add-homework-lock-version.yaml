databaseChangeLog:
  - changeSet:
      id: 0.4.0-add-assignments-lock-version
      author: codillas
      comment: Add optimistic-lock version column to assignments (0.4.0)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: assignments
                columnName: lock_version
      changes:
        - addColumn:
            tableName: assignments
            columns:
              - column:
                  name: lock_version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
