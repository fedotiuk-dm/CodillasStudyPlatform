databaseChangeLog:
  - changeSet:
      id: 0.4.0-add-courses-lock-version
      author: codillas
      comment: Add optimistic-lock version column to courses (0.4.0)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: courses
                columnName: lock_version
      changes:
        - addColumn:
            tableName: courses
            columns:
              - column:
                  name: lock_version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
