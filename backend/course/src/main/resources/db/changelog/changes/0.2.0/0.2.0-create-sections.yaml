databaseChangeLog:
  - changeSet:
      id: 0.2.0-create-sections
      author: codillas
      comment: Create sections table (course structure 0.2.0)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sections
      changes:
        - createTable:
            tableName: sections
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: course_id
                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: title
                  type: varchar(200)
                  constraints: { nullable: false }
              - column:
                  name: sort_order
                  type: int
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: timestamptz
              - column:
                  name: updated_at
                  type: timestamptz
