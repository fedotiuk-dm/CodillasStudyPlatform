# Demo seed extras — runs ONLY under the `seed` Liquibase context (dev stack sets it).
databaseChangeLog:
  - changeSet:
      id: 0.5.0-seed-course-extras
      author: codillas
      context: seed
      comment: Demo course structure + DRAFT/ARCHIVED courses (dev only)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck:
                expectedResult: 1
                sql: SELECT count(*) FROM courses WHERE name = 'Algorithms 101'
      changes:
        - sqlFile:
            path: 0.5.0-seed-course-extras.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
