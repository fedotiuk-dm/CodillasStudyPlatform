databaseChangeLog:
  - changeSet:
      id: 0.2.0-add-stored_files-lock-version
      author: codillas
      comment: Add optimistic-lock version column to stored_files (0.2.0)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: stored_files
                columnName: lock_version
      changes:
        - addColumn:
            tableName: stored_files
            columns:
              - column:
                  name: lock_version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
