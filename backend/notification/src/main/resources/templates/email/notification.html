<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <title th:text="${title}">Notification</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif;
    "
  >
    <!-- Preheader: hidden in the body, shown in the inbox preview. -->
    <div
      style="display: none; max-height: 0; overflow: hidden; opacity: 0"
      th:text="${title}"
    ></div>

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f5f7"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              width: 100%;
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            "
          >
            <!-- Header / brand -->
            <tr>
              <td
                style="
                  background-color: #1d4ed8;
                  padding: 24px 32px;
                  color: #ffffff;
                  font-size: 20px;
                  font-weight: 700;
                  letter-spacing: 0.4px;
                "
              >
                Codillas
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 32px">
                <h1
                  th:text="${title}"
                  style="
                    margin: 0 0 16px 0;
                    font-size: 22px;
                    line-height: 1.3;
                    color: #111827;
                    font-weight: 700;
                  "
                >
                  Notification
                </h1>
                <p
                  th:text="${body}"
                  style="
                    margin: 0;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #374151;
                  "
                >
                  Notification body.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 20px 32px;
                  border-top: 1px solid #e5e7eb;
                  color: #9ca3af;
                  font-size: 12px;
                  line-height: 1.5;
                "
              >
                Codillas Study Platform — this is an automated message, please do not reply.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
