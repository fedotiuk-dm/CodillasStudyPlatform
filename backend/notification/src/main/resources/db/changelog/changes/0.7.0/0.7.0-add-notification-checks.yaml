# CHECK constraint for notification kinds, mirroring NotificationType (EnumCheckConstraintTest in
# `main` fails the build if they drift).
databaseChangeLog:
  - changeSet:
      id: 0.7.0-add-notification-checks
      author: codillas
      comment: Enum guard for notification kinds (0.7.0)
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT count(*) FROM pg_constraint WHERE conname = 'ck_notifications_type'
      changes:
        - sql:
            sql: >-
              ALTER TABLE notifications ADD CONSTRAINT ck_notifications_type
                CHECK (type IN ('ASSIGNMENT_PUBLISHED','ASSIGNMENT_DUE_SOON','SUBMISSION_GRADED',
                  'ATTEMPT_COMPLETED','DIRECT_MESSAGE','ANNOUNCEMENT_POSTED'))
            rollback: ALTER TABLE notifications DROP CONSTRAINT ck_notifications_type
