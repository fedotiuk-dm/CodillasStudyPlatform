databaseChangeLog:
  - changeSet:
      id: 0.3.0-add-notifications-lock-version
      author: codillas
      comment: Add optimistic-lock version column to notifications (0.3.0)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: notifications
                columnName: lock_version
      changes:
        - addColumn:
            tableName: notifications
            columns:
              - column:
                  name: lock_version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
  - changeSet:
      id: 0.3.0-add-notification_memberships-lock-version
