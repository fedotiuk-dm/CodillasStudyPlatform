databaseChangeLog:
  - changeSet:
      id: 0.3.0-add-tests-lock-version
      author: codillas
      comment: Add optimistic-lock version column to tests (0.3.0)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: tests
                columnName: lock_version
      changes:
        - addColumn:
            tableName: tests
            columns:
              - column:
                  name: lock_version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
