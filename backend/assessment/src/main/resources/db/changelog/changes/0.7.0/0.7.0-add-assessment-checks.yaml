# CHECK constraints for tests and attempts. One ALTER per table — Postgres validates every
# added constraint in a single scan. Enum lists mirror the module's Java enums (TestStatus,
# QuestionType, AttemptStatus); EnumCheckConstraintTest in `main` fails the build if they drift.
databaseChangeLog:
  - changeSet:
      id: 0.7.0-add-assessment-checks
      author: codillas
      comment: Enum + score/window guards for tests and attempts (0.7.0)
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT count(*) FROM pg_constraint WHERE conname = 'ck_tests_status'
      changes:
        - sql:
            sql: >-
              ALTER TABLE tests
                ADD CONSTRAINT ck_tests_status CHECK (status IN ('DRAFT','PUBLISHED')),
                ADD CONSTRAINT ck_tests_config CHECK ((max_attempts IS NULL OR max_attempts > 0)
                  AND (duration_minutes IS NULL OR duration_minutes > 0)),
                ADD CONSTRAINT ck_tests_window CHECK (available_from IS NULL OR available_until IS NULL
                  OR available_from < available_until)
            rollback: >-
              ALTER TABLE tests DROP CONSTRAINT ck_tests_status,
                DROP CONSTRAINT ck_tests_config, DROP CONSTRAINT ck_tests_window
        - sql:
            sql: >-
              ALTER TABLE questions
                ADD CONSTRAINT ck_questions_type CHECK (type IN ('SINGLE_CHOICE','MULTIPLE_CHOICE',
                  'TRUE_FALSE','SHORT_TEXT','CODE')),
                ADD CONSTRAINT ck_questions_bounds CHECK (points > 0 AND sort_order >= 0)
            rollback: >-
              ALTER TABLE questions DROP CONSTRAINT ck_questions_type,
                DROP CONSTRAINT ck_questions_bounds
        - sql:
            sql: ALTER TABLE options ADD CONSTRAINT ck_options_position CHECK ("position" >= 0)
            rollback: ALTER TABLE options DROP CONSTRAINT ck_options_position
        - sql:
            sql: >-
              ALTER TABLE attempts
                ADD CONSTRAINT ck_attempts_status CHECK (status IN ('IN_PROGRESS','SUBMITTED','GRADED')),
                ADD CONSTRAINT ck_attempts_bounds CHECK (attempt_number > 0 AND score >= 0)
            rollback: >-
              ALTER TABLE attempts DROP CONSTRAINT ck_attempts_status,
                DROP CONSTRAINT ck_attempts_bounds
        - sql:
            sql: >-
              ALTER TABLE answers ADD CONSTRAINT ck_answers_awarded_points
                CHECK (awarded_points IS NULL OR awarded_points >= 0)
            rollback: ALTER TABLE answers DROP CONSTRAINT ck_answers_awarded_points
