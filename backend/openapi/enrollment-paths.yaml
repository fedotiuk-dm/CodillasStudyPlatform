openapi: 3.0.4
info:
  title: Codillas Enrollment API
  description: Cohorts (groups) running a course on a schedule.
  version: 0.2.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Codillas
    email: support@codillas.de
servers:
  - url: http://localhost:8081
    description: Local development
tags:
  - name: enrollment
    description: Group (cohort) operations
paths:
  /api/groups:
    get:
      tags:
        - enrollment
      operationId: listGroups
      summary: List groups (paginated)
      x-spring-paginated: true
      parameters:
        - $ref: "common.yaml#/components/parameters/PageNumber"
        - $ref: "common.yaml#/components/parameters/PageSize"
        - $ref: "common.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: Paginated groups
          content:
            application/json:
              schema:
                $ref: "enrollment-schemas.yaml#/components/schemas/GroupListResponse"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
    post:
      tags:
        - enrollment
      operationId: createGroup
      summary: Create a group for a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "enrollment-schemas.yaml#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "enrollment-schemas.yaml#/components/schemas/GroupResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
  /api/me/groups:
    get:
      tags:
        - enrollment
      operationId: listMyGroups
      summary: List the groups the authenticated user belongs to
      responses:
        "200":
          description: The authenticated user's groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "enrollment-schemas.yaml#/components/schemas/GroupResponse"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
  /api/me/schedule:
    get:
      tags:
        - enrollment
      operationId: listMySchedule
      summary: The authenticated user's lesson schedule across their groups (earliest first, past and upcoming)
      responses:
        "200":
          description: Scheduled lessons across the user's groups, earliest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "enrollment-schemas.yaml#/components/schemas/ScheduledLessonResponse"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
  /api/groups/{groupId}/members:
    post:
      tags:
        - enrollment
      operationId: enrollStudent
      summary: Enrol a student into a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "enrollment-schemas.yaml#/components/schemas/EnrollStudentRequest"
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "enrollment-schemas.yaml#/components/schemas/MembershipResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
    get:
      tags:
        - enrollment
      operationId: listGroupMembers
      summary: List a group's members
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Group members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "enrollment-schemas.yaml#/components/schemas/MembershipResponse"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
  /api/groups/{groupId}/lessons:
    post:
      tags:
        - enrollment
      operationId: scheduleLesson
      summary: Schedule a lesson session for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "enrollment-schemas.yaml#/components/schemas/ScheduleLessonRequest"
      responses:
        "201":
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: "enrollment-schemas.yaml#/components/schemas/ScheduledLessonResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
    get:
      tags:
        - enrollment
      operationId: listScheduledLessons
      summary: List a group's scheduled lessons
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scheduled lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "enrollment-schemas.yaml#/components/schemas/ScheduledLessonResponse"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
  /api/groups/{groupId}/lessons/{scheduledLessonId}/attendance:
    get:
      tags:
        - enrollment
      operationId: listAttendance
      summary: List the recorded attendance for a scheduled lesson
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scheduledLessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attendance records for the lesson
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "enrollment-schemas.yaml#/components/schemas/AttendanceResponse"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
    put:
      tags:
        - enrollment
      operationId: markAttendance
      summary: Mark a student's attendance for a scheduled lesson
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scheduledLessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "enrollment-schemas.yaml#/components/schemas/MarkAttendanceRequest"
      responses:
        "200":
          description: Attendance recorded
          content:
            application/json:
              schema:
                $ref: "enrollment-schemas.yaml#/components/schemas/AttendanceResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
