openapi: 3.0.4
info:
  title: Codillas Enrollment schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    GroupResponse:
      type: object
      required:
        - id
        - name
        - courseId
        - teacherId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        courseId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    CreateGroupRequest:
      type: object
      required:
        - name
        - courseId
        - teacherId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        courseId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
    GroupListResponse:
      allOf:
        - $ref: "common.yaml#/components/schemas/PageResponse"
        - type: object
          required:
            - content
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/GroupResponse"
    EnrollStudentRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
    MembershipResponse:
      type: object
      required:
        - id
        - groupId
        - userId
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        enrolledAt:
          type: string
          format: date-time
