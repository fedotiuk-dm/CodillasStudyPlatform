openapi: 3.0.4
info:
  title: Codillas User API
  description: User profiles and identity.
  version: 0.2.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Codillas
    email: support@codillas.de
servers:
  - url: http://localhost:8081
    description: Local development
tags:
  - name: user
    description: User profile operations
paths:
  /api/users:
    get:
      tags:
        - user
      operationId: listProfiles
      summary: List / search local user profiles (paginated)
      x-spring-paginated: true
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive filter on display name.
          schema:
            type: string
        - $ref: "common.yaml#/components/parameters/PageNumber"
        - $ref: "common.yaml#/components/parameters/PageSize"
        - $ref: "common.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: Paginated profiles
          content:
            application/json:
              schema:
                $ref: "user-schemas.yaml#/components/schemas/UserProfileListResponse"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
  /api/users/me:
    get:
      tags:
        - user
      operationId: getMyProfile
      summary: Get the current user's profile
      responses:
        "200":
          description: My profile
          content:
            application/json:
              schema:
                $ref: "user-schemas.yaml#/components/schemas/UserProfile"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
    put:
      tags:
        - user
      operationId: updateMyProfile
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "user-schemas.yaml#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "user-schemas.yaml#/components/schemas/UserProfile"
        "400":
          $ref: "common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
