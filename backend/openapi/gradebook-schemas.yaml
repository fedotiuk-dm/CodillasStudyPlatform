openapi: 3.0.4
info:
  title: Codillas Gradebook schemas
  version: 0.2.0
paths: {}
components:
  schemas:
    GradeSource:
      type: string
      description: What produced the grade.
      enum:
        - HOMEWORK
        - TEST
    ProgressEntryResponse:
      type: object
      required:
        - id
        - source
        - sourceId
        - referenceId
        - score
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/GradeSource"
        sourceId:
          type: string
          format: uuid
          description: The graded artefact (submission or attempt).
        referenceId:
          type: string
          format: uuid
          description: The assignment or test the artefact belongs to.
        score:
          type: integer
        maxPoints:
          type: integer
          description: Weighting denominator for this entry.
        recordedAt:
          type: string
          format: date-time
    TypeGradeResponse:
      type: object
      description: Raw points for one source type; the client derives any percentage.
      required:
        - source
        - awarded
        - maxPoints
      properties:
        source:
          $ref: "#/components/schemas/GradeSource"
        awarded:
          type: integer
        maxPoints:
          type: integer
    CourseGradeResponse:
      type: object
      description: Raw points-weighted totals; the client derives any percentage.
      required:
        - awarded
        - maxPoints
        - byType
      properties:
        awarded:
          type: integer
        maxPoints:
          type: integer
        byType:
          type: array
          items:
            $ref: "#/components/schemas/TypeGradeResponse"
    StudentGradebookResponse:
      type: object
      required:
        - studentId
        - entries
      properties:
        studentId:
          type: string
          format: uuid
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ProgressEntryResponse"
        courseGrade:
          $ref: "#/components/schemas/CourseGradeResponse"
    GroupGradebookResponse:
      type: object
      required:
        - groupId
        - students
      properties:
        groupId:
          type: string
          format: uuid
        students:
          type: array
          items:
            $ref: "#/components/schemas/StudentGradebookResponse"
