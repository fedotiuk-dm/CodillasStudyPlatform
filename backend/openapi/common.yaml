openapi: 3.0.4
info:
  title: Codillas common OpenAPI components
  description: Shared parameters, schemas and responses reused across every module spec.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
paths: {}
components:
  # Pagination: a paginated operation sets BOTH `x-spring-paginated: true` (the Spring backend
  # generator turns it into a `Pageable` param) AND these explicit page/size/sort params (Orval and
  # other clients don't understand the vendor extension, so they need the real params). The Spring
  # generator ignores the explicit params when x-spring-paginated is on, so there's no duplication.
  parameters:
    PageNumber:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: "Sort criteria: property,(asc|desc). Repeatable."
      schema:
        type: array
        items:
          type: string
  schemas:
    # Base page envelope. A concrete list response is:
    #   MyListResponse:
    #     allOf:
    #       - $ref: "common.yaml#/components/schemas/PageResponse"
    #       - type: object
    #         required: [content]
    #         properties:
    #           content:
    #             type: array
    #             items:
    #               $ref: "...MyItem"
    PageResponse:
      type: object
      required:
        - totalElements
        - totalPages
        - size
        - number
      properties:
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 0
        numberOfElements:
          type: integer
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    # RFC 9457 error body — matches what the backend emits (Spring ProblemDetail).
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
      additionalProperties: true
  # Reusable error responses — reference these instead of re-declaring error bodies per operation.
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
