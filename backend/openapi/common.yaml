openapi: 3.0.4
info:
  title: Codillas common OpenAPI components
  version: 1.0.0
paths: {}
components:
  # Pagination: prefer `x-spring-paginated: true` on the operation (generates a Spring
  # `Pageable` param). These params exist for specs that need them explicitly — do NOT combine
  # them with x-spring-paginated on the same operation.
  parameters:
    PageNumber:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    PageSize:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
  schemas:
    # Base page envelope. A concrete list response is:
    #   MyListResponse:
    #     allOf:
    #       - $ref: "common.yaml#/components/schemas/PageResponse"
    #       - type: object
    #         required: [content]
    #         properties: { content: { type: array, items: { $ref: "...MyItem" } } }
    PageResponse:
      type: object
      required: [totalElements, totalPages, size, number]
      properties:
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        number: { type: integer, minimum: 0 }
        numberOfElements: { type: integer, minimum: 0 }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: integer }
        message: { type: string }
        timestamp: { type: string, format: date-time }
