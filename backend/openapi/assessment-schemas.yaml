openapi: 3.0.4
info:
  title: Codillas Assessment schemas
  version: 0.3.0
paths: {}
components:
  schemas:
    TestStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
    QuestionType:
      type: string
      description: Discriminator for the question shape — choice types carry options; SHORT_TEXT and CODE are manually-graded free text.
      enum:
        - SINGLE_CHOICE
        - MULTIPLE_CHOICE
        - TRUE_FALSE
        - SHORT_TEXT
        - CODE
    AttemptStatus:
      type: string
      enum:
        - IN_PROGRESS
        - SUBMITTED
        - GRADED
    CreateTestRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        lessonId:
          type: string
          format: uuid
          description: Optional course lesson this test belongs to.
        maxAttempts:
          type: integer
          minimum: 1
          description: Max attempts a student may start; omit for unlimited.
        durationMinutes:
          type: integer
          minimum: 1
          description: Time limit from the attempt's start; omit for untimed.
        availableFrom:
          type: string
          format: date-time
          description: Attempts may only start at or after this instant.
        availableUntil:
          type: string
          format: date-time
          description: Attempts may only start at or before this instant.
        shuffleQuestions:
          type: boolean
          default: false
        shuffleOptions:
          type: boolean
          default: false
    TestSummary:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: string
          format: uuid
        lessonId:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/TestStatus"
        createdAt:
          type: string
          format: date-time
    TestResponse:
      type: object
      required:
        - id
        - title
        - status
        - questions
        - shuffleQuestions
        - shuffleOptions
      properties:
        id:
          type: string
          format: uuid
        lessonId:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/TestStatus"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionResponse"
        maxAttempts:
          type: integer
          minimum: 1
          description: Max attempts a student may start; omit for unlimited.
        durationMinutes:
          type: integer
          minimum: 1
          description: Time limit from the attempt's start; omit for untimed.
        availableFrom:
          type: string
          format: date-time
          description: Attempts may only start at or after this instant.
        availableUntil:
          type: string
          format: date-time
          description: Attempts may only start at or before this instant.
        shuffleQuestions:
          type: boolean
          default: false
        shuffleOptions:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
    TestListResponse:
      allOf:
        - $ref: "common.yaml#/components/schemas/PageResponse"
        - type: object
          required:
            - content
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/TestSummary"
    CreateOptionRequest:
      type: object
      required:
        - text
        - correct
      properties:
        text:
          type: string
          minLength: 1
        correct:
          type: boolean
    CreateQuestionRequest:
      type: object
      required:
        - type
        - prompt
        - points
      properties:
        type:
          $ref: "#/components/schemas/QuestionType"
        prompt:
          type: string
          minLength: 1
        points:
          type: integer
          minimum: 1
        options:
          type: array
          description: Required for choice/true-false types; omit for SHORT_TEXT.
          items:
            $ref: "#/components/schemas/CreateOptionRequest"
    OptionResponse:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
    QuestionResponse:
      type: object
      required:
        - id
        - type
        - prompt
        - points
        - sortOrder
        - options
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/QuestionType"
        prompt:
          type: string
        points:
          type: integer
        sortOrder:
          type: integer
        options:
          type: array
          description: Empty for SHORT_TEXT. Correctness is never exposed.
          items:
            $ref: "#/components/schemas/OptionResponse"
    SaveAnswerRequest:
      type: object
      required:
        - questionId
      properties:
        questionId:
          type: string
          format: uuid
        selectedOptionIds:
          type: array
          items:
            type: string
            format: uuid
        text:
          type: string
    AnswerResponse:
      type: object
      required:
        - id
        - questionId
        - selectedOptionIds
      properties:
        id:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        selectedOptionIds:
          type: array
          items:
            type: string
            format: uuid
        text:
          type: string
        awardedPoints:
          type: integer
          description: Null until graded (always pending for SHORT_TEXT before manual grading).
    GradeAnswerRequest:
      type: object
      required:
        - awardedPoints
      properties:
        awardedPoints:
          type: integer
          minimum: 0
    AttemptResponse:
      type: object
      required:
        - id
        - testId
        - studentId
        - status
        - score
        - answers
        - attemptNumber
      properties:
        id:
          type: string
          format: uuid
        testId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AttemptStatus"
        score:
          type: integer
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerResponse"
        attemptNumber:
          type: integer
          description: 1-based ordinal of this attempt for the (test, student).
        startedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
