databaseChangeLog:
  - changeSet:
      id: 0.4.0-add-study_groups-lock-version
      author: codillas
      comment: Add optimistic-lock version column to study_groups (0.4.0)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: study_groups
                columnName: lock_version
      changes:
        - addColumn:
            tableName: study_groups
            columns:
              - column:
                  name: lock_version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
