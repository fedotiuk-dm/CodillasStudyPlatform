# Demo seed extras — runs ONLY under the `seed` Liquibase context (dev stack sets it).
databaseChangeLog:
  - changeSet:
      id: 0.5.0-seed-enrollment-extras
      author: codillas
      context: seed
      comment: Demo DRAFT/ARCHIVED cohorts + scheduled-lesson links (dev only)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck:
                expectedResult: 1
                sql: SELECT count(*) FROM study_groups WHERE name = 'Java Cohort B'
      changes:
        - sqlFile:
            path: 0.5.0-seed-enrollment-extras.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
