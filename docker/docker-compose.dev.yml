# Codillas — local dev stack. Self-contained, env-based (no Vault).
#   docker compose -f docker-compose.dev.yml up -d
# Backend + frontend run on the host (mvn spring-boot:run / pnpm dev).
# Vars have inline defaults, so it works with zero config; override via docker/.env.

services:
  postgres:
    image: postgres:18-alpine
    container_name: codillas-postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codillas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codillas}
      POSTGRES_DB: ${POSTGRES_DB:-codillas}
    volumes:
      - postgres_data:/var/lib/postgresql
      # Creates the extra `keycloak` database on first init (one Postgres, two databases).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codillas} -d ${POSTGRES_DB:-codillas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: codillas-keycloak
    restart: unless-stopped
    ports: ["8080:8080"]
    # Persists in the shared Postgres (database `keycloak`). The codillas realm — roles +
    # admin/teacher/student users — is imported from realm-export.json on first start.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-codillas}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-codillas}
      # Master-admin console at http://localhost:8080 (admin/admin).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./../backend/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: codillas-minio
    restart: unless-stopped
    # Host ports 9100/9101 (9000 is commonly taken — e.g. Portainer). In-container stays 9000/9001.
    ports: ["9100:9000", "9101:9001"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-codillas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-codillas123}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: codillas-minio-init
    restart: "no"
    depends_on: { minio: { condition: service_started } }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-codillas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-codillas123}
      MINIO_BUCKET: ${MINIO_BUCKET:-codillas}
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo 'waiting for minio'; sleep 2; done &&
             mc mb --ignore-existing local/$$MINIO_BUCKET &&
             mc anonymous set download local/$$MINIO_BUCKET"

  mailpit:
    image: axllent/mailpit:latest
    container_name: codillas-mailpit
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # --- Backend in DEV mode: mvnw spring-boot:run over bind-mounted source (devtools hot restart). ---
  backend:
    image: bellsoft/liberica-runtime-container:jdk-25-musl
    container_name: codillas-backend
    restart: unless-stopped
    working_dir: /workspace
    # Build all modules into the local repo first, then run only `main` (spring-boot:run on the
    # whole reactor would also hit the aggregator pom — "no main class"). Devtools restarts on
    # recompiled classes (compile on the host; target/ is bind-mounted in).
    command: ["sh", "-c", "./mvnw -q -DskipTests -pl main -am install && ./mvnw -q -pl main spring-boot:run"]
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codillas}
      DB_USER: ${POSTGRES_USER:-codillas}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-codillas}
      # Tokens are minted for the browser (iss = http://localhost:8080/...); the container reaches
      # Keycloak by service name — fetch keys there, validate the iss string against localhost.
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/codillas
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/codillas/protocol/openid-connect/certs
      FILES_ENDPOINT: http://minio:9000
      FILES_ACCESS_KEY: ${MINIO_ROOT_USER:-codillas}
      FILES_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-codillas123}
      FILES_BUCKET: ${MINIO_BUCKET:-codillas}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    volumes:
      - ../backend:/workspace
      - backend_m2:/root/.m2
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }

  # --- Frontend in DEV mode: next dev over bind-mounted source (Fast Refresh + dev indicator). ---
  frontend:
    image: node:24-alpine
    container_name: codillas-frontend
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile --ignore-scripts &&
             ./node_modules/.bin/orval &&
             ./node_modules/.bin/next dev"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
      NEXT_PUBLIC_WS_URL: ws://localhost:8081/ws
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: codillas
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: codillas-frontend
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - ../backend/openapi:/backend/openapi:ro
    depends_on:
      backend: { condition: service_started }

volumes:
  postgres_data:
  minio_data:
  backend_m2:
  frontend_node_modules:
